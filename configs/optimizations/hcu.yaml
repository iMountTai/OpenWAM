# Native Wan/ZeRO-2 HCU preset; disk caches require explicit opt-in.
defaults:
  - performance
  - _self_

# Same knob as main's PARTIAL_CHECKPOINT; CLI overrides remain independent.
# Online training: skip the last 12 of 30 layers (checkpoint the first 18).
# With both VAE/T5 disk caches enabled, a larger tail can be tried as memory
# permits, e.g. optimizations.checkpoint_skip_layers=24. Keep 12 without caches.
checkpoint_skip_layers: 12
deferred_gather: true

# Both one-stage online encoding and two-stage cached training use this preset.
# Constant/scheduler caching stays enabled through the performance preset.
text_cache: false
offline_text_cache: false
text_cache_dir: null
vae_latent_cache: false
vae_latent_cache_dir: null

compile:
  threads: 1
  coordinate_descent_tuning: true

dtk:
  enabled: true
  hw_queues: 16
  lightop_norm: true
  linear_bias2d: true
  blas_prefer_hipblaslt: true
  allow_tf32: true
  fine_grain_pcie: true
