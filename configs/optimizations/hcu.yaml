# Native Wan/ZeRO-2 performance preset plus DTK-only settings.
defaults:
  - performance
  - _self_

compile:
  threads: 1
  coordinate_descent_tuning: true

dtk:
  enabled: true
  hw_queues: 16
  lightop_norm: true
  linear_bias2d: true
  blas_prefer_hipblaslt: true
  allow_tf32: true
  fine_grain_pcie: true
