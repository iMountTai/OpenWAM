# Conservative defaults on every platform; baseline disables the two data fast paths.
vae_channels_last: false
constant_cache: false
text_cache: false  # Bounded online prompt LRU; independent of offline text caching.
offline_text_cache: false
text_cache_size: 32
text_cache_dir: null  # Offline T5 store; otherwise uses latent-cache-dir/text when a latent directory is configured.
fa2_padding: false
padding_plan_cpu: true
mot_split_attn: false
rope_real: false
zero_overlap: false
checkpoint_skip_layers: 0
uint8_preprocess: true
t5_prefix: false
text_trim: false
zero_reduce_scatter: false
online_encode: false
deferred_gather: false  # Wait for updated ZeRO-2 parameters per MoT layer in the next forward.
fused_adamw: false
host_async: false  # Drop per-step host syncs; step metrics are logged one step late.
vae_latent_cache: false  # Read latents written by scripts/cache_vae_latents.py.
vae_latent_cache_dir: null

compile:
  mot: false
  vae: false
  pointwise: false
  vae_pointwise: false
  attention_mask: false
  threads: null
  coordinate_descent_tuning: false

sac:
  attention: false
  ffn_full: false
  gemm: false
  layers: null  # All checkpointed layers when a SAC policy is enabled.
  extra_ops: []

dtk:
  enabled: false  # USE_DTK equivalent; also requires DTK build metadata.
  hw_queues: null
  lightop_norm: false  # Optional DAS Lightop; never imported on AMD/NVIDIA.
  linear_bias2d: false  # gfx936 projection path, guarded by tensor/backend capabilities.
  blas_prefer_hipblaslt: false
  allow_tf32: false
  fine_grain_pcie: false

profiling:
  ranks: 'off'  # off / rank0 / all
  light: false

diagnostics:
  checkpoint_stats: false
  trace_gc: false
